<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Prevención de Riesgos · Universidad Latina de Panamá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #081f56;
    --navy-deep: #050f30;
    --blue: #1246d9;
    --blue-soft: #3b7de8;
    --blue-tint: #e4effd;
    --paper: #f5f8fd;
    --white: #ffffff;
    --ink: #0b1730;
    --muted: #5b6b8c;
    --green: #1fae5c;
    --radius: 22px;
    --route-w: 3px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x:hidden;
  }
  h1,h2,h3, .display{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  img{max-width:100%; display:block;}
  button{font-family:inherit;}

  /* ---------------- LOADER ---------------- */
  #loader{
    position:fixed; inset:0; z-index:999;
    background: radial-gradient(120% 140% at 50% 0%, #0d2a6e 0%, var(--navy-deep) 55%, #030816 100%);
    display:flex; align-items:center; justify-content:center;
    transition: opacity .7s ease, visibility .7s ease;
  }
  #loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .loader-inner{
    width:min(340px, 84vw);
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }
  .route-stage{
    position:relative;
    width:220px; height:220px;
    margin-bottom:22px;
  }
  .route-stage svg{ width:100%; height:100%; overflow:visible; }
  .route-path{
    fill:none;
    stroke: var(--blue-soft);
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray: 620;
    stroke-dashoffset: 620;
    animation: drawPath 2.1s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes drawPath{ to{ stroke-dashoffset:0; } }
  .route-dot-start, .route-dot-end{
    opacity:0;
    animation: popIn .4s ease forwards;
  }
  .route-dot-start{ animation-delay:.05s; }
  .route-dot-end{ animation-delay:1.95s; }
  @keyframes popIn{ from{opacity:0; transform:scale(.4);} to{opacity:1; transform:scale(1);} }
  .exit-glow{
    opacity:0;
    animation: glowIn .6s ease forwards, glowPulse 1.4s ease-in-out infinite;
    animation-delay: 2s, 2.6s;
    transform-origin:center;
  }
  @keyframes glowIn{ to{opacity:1;} }
  @keyframes glowPulse{ 0%,100%{ filter:drop-shadow(0 0 2px #37e07a);} 50%{ filter:drop-shadow(0 0 9px #37e07a);} }
  .walker{
    opacity:0;
    animation: walkIn .3s ease forwards;
  }
  @keyframes walkIn{ to{opacity:1;} }
  .loader-pct{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.14em;
    color: var(--blue-soft);
    margin-bottom:8px;
    opacity:.9;
  }
  .loader-msg{
    color:#c9d7fb;
    font-size:14.5px;
    font-weight:500;
    min-height:20px;
    margin-bottom:26px;
  }
  .guide{
    display:flex; flex-direction:column; align-items:center;
    opacity:0; transform:translateY(10px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .guide.show{ opacity:1; transform:translateY(0); }
  .guide-badge{
    width:64px; height:64px; border-radius:50%;
    background: linear-gradient(160deg, var(--blue-soft), var(--blue));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 24px rgba(18,70,217,.45);
    margin-bottom:12px;
  }
  .guide-badge svg{ width:34px; height:34px; }
  .wave-hand{ transform-origin: 70% 80%; animation: wave 1.1s ease-in-out .15s 2; }
  @keyframes wave{
    0%,100%{ transform: rotate(0deg); }
    20%{ transform: rotate(-14deg); }
    40%{ transform: rotate(12deg); }
    60%{ transform: rotate(-9deg); }
    80%{ transform: rotate(6deg); }
  }
  .guide-text{
    color:#eef3ff; font-size:15px; line-height:1.5; font-weight:500;
    max-width:280px;
  }
  .guide-text b{ color:#fff; }

  /* ---------------- ROUTE RAIL (signature element) ---------------- */
  .rail{
    position:fixed;
    left:14px; top:0;
    height:100vh;
    width:34px;
    z-index:40;
    display:flex; align-items:center;
    pointer-events:none;
  }
  .rail-track{
    position:relative;
    width:var(--route-w); height:70vh;
    background: rgba(8,31,86,.12);
    border-radius:4px;
    margin-left:15px;
  }
  .rail-fill{
    position:absolute; top:0; left:0; width:100%;
    height:0%;
    background: linear-gradient(180deg, var(--blue-soft), var(--blue));
    border-radius:4px;
    transition: height .1s linear;
  }
  .rail-dot{
    position:absolute; left:50%; transform:translate(-50%,-50%);
    width:15px; height:15px; border-radius:50%;
    background:#fff;
    border:3px solid var(--blue-tint);
    transition: border-color .3s ease, background .3s ease, transform .3s ease;
  }
  .rail-dot.active{
    border-color: var(--blue);
    background: var(--blue);
    transform:translate(-50%,-50%) scale(1.15);
  }
  .rail-dot.done{
    border-color: var(--green);
    background: var(--green);
  }
  @media (max-width: 720px){
    .rail{ width:22px; left:6px; }
    .rail-track{ margin-left:9px; }
  }

  /* ---------------- LAYOUT ---------------- */
  .wrap{ padding-left:40px; }
  @media (max-width:720px){ .wrap{ padding-left:26px; } }

  section{
    position:relative;
    padding: 88px 20px 88px 0;
    display:flex;
    justify-content:center;
  }
  .card-col{
    width:100%;
    max-width:520px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }

  .hero{
    background: radial-gradient(130% 100% at 50% 0%, #0d2a6e 0%, var(--navy-deep) 60%, #050b1e 100%);
    color:#fff;
    padding-top:64px;
    padding-bottom:96px;
  }
  .eyebrow{
    font-family:'Poppins',sans-serif;
    font-size:12.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color: var(--blue-soft);
    margin-bottom:14px;
    opacity:0; transform:translateY(8px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .hero-title{
    font-size:clamp(26px, 6vw, 34px);
    color:#fff;
    line-height:1.18;
    margin: 0 0 16px;
    min-height: 2.4em;
  }
  .typecursor{
    display:inline-block; width:3px; height:1em; background:var(--blue-soft);
    margin-left:2px; vertical-align:-0.15em;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .hero-sub{
    color:#b9c6ee; font-size:15.5px; line-height:1.6; max-width:380px;
    margin:0 0 34px;
    opacity:0; transform:translateY(10px);
    transition: opacity .6s ease .15s, transform .6s ease .15s;
  }
  .imgcard{
    position:relative;
    border-radius: var(--radius);
    overflow:hidden;
    background:#fff;
    box-shadow: 0 20px 46px rgba(5,15,48,.35);
    opacity:0; transform:translateY(26px) scale(.98);
    transition: opacity .7s ease, transform .7s ease;
    cursor: zoom-in;
    width:100%;
  }
  .imgcard img{ width:100%; }
  .imgcard .zoomhint{
    position:absolute; right:10px; bottom:10px;
    width:34px; height:34px; border-radius:50%;
    background:rgba(8,31,86,.72);
    backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition: opacity .3s ease;
  }
  .imgcard:hover .zoomhint, .imgcard:active .zoomhint{ opacity:1; }
  .imgcard .zoomhint svg{ width:16px; height:16px; }
  .tapcaption{
    font-size:12px; color: var(--muted); margin-top:10px; letter-spacing:.02em;
    opacity:0; transition: opacity .6s ease .3s;
  }

  .scrolldown{
    margin-top:44px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    color:#9fb0dd; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
    opacity:0; transition: opacity .6s ease .3s;
  }
  .chev{ width:16px; height:16px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }

  .in-view .eyebrow, .in-view .hero-sub, .in-view .scrolldown{ opacity:1; transform:translateY(0); }
  .in-view .imgcard{ opacity:1; transform:translateY(0) scale(1); }
  .in-view .tapcaption{ opacity:1; }

  .step-section{ background: var(--paper); }
  .step-section.alt{ background: linear-gradient(180deg, #eef3fd, #e3ecfc); }
  .waypoint{
    display:inline-flex; align-items:center; gap:8px;
    background: var(--white);
    border:1px solid #dbe4f7;
    padding:7px 14px 7px 8px;
    border-radius:999px;
    font-family:'Poppins',sans-serif;
    font-weight:700; font-size:12.5px; color: var(--blue);
    margin-bottom:18px;
    opacity:0; transform:translateY(10px);
    transition: opacity .55s ease, transform .55s ease;
  }
  .waypoint .num{
    width:22px; height:22px; border-radius:50%;
    background: var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px;
  }
  .step-title{
    font-size: clamp(21px, 5vw, 27px);
    color: var(--navy);
    margin: 0 0 12px;
    opacity:0; transform:translateY(10px);
    transition: opacity .55s ease .08s, transform .55s ease .08s;
  }
  .step-body{
    color: var(--muted); font-size:15px; line-height:1.65; max-width:400px;
    margin:0 0 30px;
    opacity:0; transform:translateY(10px);
    transition: opacity .55s ease .16s, transform .55s ease .16s;
  }
  .in-view .waypoint, .in-view .step-title, .in-view .step-body{ opacity:1; transform:translateY(0); }

  .closing{
    background: linear-gradient(180deg, #081f56, #030815);
    color:#fff;
    text-align:center;
  }
  .closing .waypoint{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14); color:#8fe3b0; }
  .closing .waypoint .num{ background: var(--green); }
  .closing .step-title{ color:#fff; }
  .closing .step-body{ color:#b9c6ee; }
  .restart-btn{
    font-family:'Poppins',sans-serif;
    font-weight:700; font-size:13.5px;
    color: var(--navy-deep);
    background:#fff;
    border:none; padding:13px 26px; border-radius:999px;
    cursor:pointer;
    opacity:0; transform:translateY(10px);
    transition: opacity .55s ease .24s, transform .55s ease .24s;
  }
  .in-view .restart-btn{ opacity:1; transform:translateY(0); }
  .footer-credit{
    margin-top:26px; font-size:11.5px; color:#7f8fc0; letter-spacing:.03em;
    opacity:0; transition: opacity .55s ease .3s;
  }
  .in-view .footer-credit{ opacity:1; }

  /* ambient floating icons (background only, never over content) */
  .ambient{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .ambient svg{
    position:absolute; opacity:.09; filter: blur(.2px);
  }
  .card-col{ position:relative; z-index:1; }
  .float1{ animation: floatY 7s ease-in-out infinite; }
  .float2{ animation: floatY 9s ease-in-out infinite 1s; }
  .float3{ animation: floatY 8s ease-in-out infinite .4s; }
  @keyframes floatY{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-18px) rotate(6deg);} }

  /* ---------------- LIGHTBOX ---------------- */
  #lightbox{
    position:fixed; inset:0; z-index:900;
    background: rgba(3,8,22,.92);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition: opacity .3s ease, visibility .3s ease;
    padding:26px;
    touch-action: pinch-zoom;
  }
  #lightbox.show{ opacity:1; visibility:visible; }
  #lightbox img{
    max-width:100%; max-height:88vh;
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    transition: transform .25s ease;
    touch-action: pinch-zoom;
  }
  #lightbox .close{
    position:absolute; top:18px; right:18px;
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,.12);
    border:none; color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #lightbox .hint{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    color:#9fb0dd; font-size:12px; letter-spacing:.04em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<!-- ===================== LOADER ===================== -->
<div id="loader">
  <div class="loader-inner">
    <div class="loader-pct" id="loaderPct">0%</div>
    <div class="route-stage">
      <svg viewBox="0 0 220 220" fill="none">
        <circle class="route-dot-start" cx="34" cy="40" r="9" fill="#3b7de8"/>

            path="M34 40 C 34 100, 90 70, 100 120 S 150 150, 150 180"/>

        <g class="exit-glow" transform="translate(150,180)">
          <rect x="-16" y="-16" width="32" height="32" rx="8" fill="#0e2a63" stroke="#37e07a" stroke-width="2"/>

        </g>
      </svg>
    </div>
    <div class="loader-msg" id="loaderMsg">Trazando la ruta de evacuación…</div>
    <div class="guide" id="guide">

        <svg class="wave-hand" viewBox="0 0 24 24" fill="none">

</div>

<!-- ===================== ROUTE RAIL ===================== -->
<div class="rail" aria-hidden="true">

    <div class="rail-fill" id="railFill"></div>
    <div class="rail-dot" id="dot0" style="top:0%"></div>
    <div class="rail-dot" id="dot1" style="top:33%"></div>
    <div class="rail-dot" id="dot2" style="top:66%"></div>
    <div class="rail-dot" id="dot3" style="top:100%"></div>
  </div>
</div>

<div class="wrap">

  <!-- ===================== HERO ===================== -->
  <section class="hero observe" id="sec0">
    <div class="ambient">
      <svg class="float1" style="top:10%;left:8%;width:70px;height:70px" viewBox="0 0 24 24" fill="none"><path d="M12 2l9 4v6c0 5-3.8 8.4-9 10-5.2-1.6-9-5-9-10V6l9-4z" stroke="#3b7de8" stroke-width="1.4"/></svg>
      <svg class="float2" style="top:60%;right:6%;width:54px;height:54px" viewBox="0 0 24 24" fill="none"><path d="M4 12h13M13 6l6 6-6 6" stroke="#3b7de8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="float3" style="top:80%;left:14%;width:40px;height:40px" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#3b7de8" stroke-width="1.4"/><path d="M12 7v6l4 2" stroke="#3b7de8" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
